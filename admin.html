<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#04101e">
<title>Histórico de Simulações | San Marino Flex</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:linear-gradient(135deg,#04101e,#020c14);color:#eef5ff;font-family:Arial,Helvetica,sans-serif}.top{height:58px;display:flex;align-items:center;gap:12px;padding:7px 18px;background:#020811;border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:0;z-index:10}.top img{height:42px}.top-actions{margin-left:auto;display:flex;gap:7px;align-items:center}.user{font-size:10px;color:#91abc4;text-align:right}.user strong{display:block;color:#fff}.btn{height:35px;border:0;border-radius:8px;padding:0 13px;font-size:10px;font-weight:900;text-transform:uppercase;cursor:pointer}.primary{background:#22d47e;color:#02130b}.secondary{background:rgba(37,215,243,.08);border:1px solid rgba(37,215,243,.3);color:#caf7ff}.danger{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.32);color:#fca5a5}.wrap{padding:16px;max-width:1500px;margin:auto}.title-row{display:flex;align-items:end;gap:12px;margin-bottom:13px}.title-row h1{font-size:22px}.title-row p{font-size:11px;color:#809bb5}.filters{display:grid;grid-template-columns:minmax(220px,2fr) repeat(4,minmax(125px,1fr));gap:8px;padding:12px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(8,22,42,.75);margin-bottom:12px}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:8px;color:#829cb5;font-weight:900;text-transform:uppercase;letter-spacing:.5px}.field input,.field select,.field textarea{width:100%;height:36px;border:1px solid rgba(255,255,255,.14);border-radius:7px;background:#020914;color:#eef5ff;padding:0 9px;font-size:11px;outline:none}.field textarea{height:80px;padding:8px;resize:vertical}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.card{border:1px solid rgba(37,215,243,.18);border-radius:10px;padding:11px;background:rgba(8,22,42,.66)}.card span{display:block;font-size:8px;color:#7f9ab4;text-transform:uppercase;font-weight:900}.card strong{display:block;margin-top:4px;font-size:18px;color:#ffd700}.table-box{overflow:auto;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(5,15,29,.85)}table{width:100%;border-collapse:collapse;min-width:1300px}th{position:sticky;top:0;background:#0b2038;color:#91abc4;font-size:8px;text-transform:uppercase;letter-spacing:.45px;padding:9px 7px;text-align:left}td{padding:8px 7px;border-top:1px solid rgba(255,255,255,.055);font-size:10px;color:#d7e4ef;white-space:nowrap}td.notes{white-space:normal;min-width:180px;max-width:280px}.pill{display:inline-block;border-radius:99px;padding:4px 7px;font-size:8px;font-weight:900}.ok{background:rgba(34,212,126,.13);color:#5ee6a4}.no{background:rgba(248,113,113,.12);color:#fca5a5}.row-actions{display:flex;gap:4px}.row-actions .btn{height:27px;padding:0 8px;font-size:8px}.empty{text-align:center;padding:30px!important;color:#7f9ab4}.admin-users{display:none;margin-top:16px;border:1px solid rgba(255,215,0,.2);border-radius:12px;padding:13px;background:rgba(255,215,0,.025)}.admin-users.visible{display:block}.admin-users h2{font-size:15px;color:#ffd700;margin-bottom:10px}.user-form{display:grid;grid-template-columns:1.3fr 1.5fr 1fr 1.2fr auto;gap:7px;align-items:end}.user-list{display:grid;gap:6px;margin-top:12px}.user-item{display:grid;grid-template-columns:1.2fr 1.5fr 1fr auto auto;gap:7px;align-items:center;padding:8px;border-top:1px solid rgba(255,255,255,.07);font-size:10px}.message{min-height:18px;margin-top:7px;font-size:10px;color:#91abc4}.message.error{color:#fca5a5}.message.success{color:#5ee6a4}dialog{width:min(520px,calc(100% - 28px));border:1px solid rgba(37,215,243,.25);border-radius:14px;background:#071525;color:#eef5ff;padding:18px;margin:auto}dialog::backdrop{background:rgba(0,0,0,.68)}dialog h2{font-size:16px;margin-bottom:12px}.dialog-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dialog-grid .wide{grid-column:1/-1}.dialog-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:12px}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters .field:first-child{grid-column:1/-1}.summary{grid-template-columns:1fr 1fr}.user-form{grid-template-columns:1fr 1fr}.user-form .btn{grid-column:1/-1}.top .user{display:none}}
</style>
</head>
<body>
<header class="top"><img src="logo_sm_flex.png" alt="San Marino Flex"><div class="top-actions"><div class="user" id="panelUser"><strong>--</strong></div><button class="btn secondary" id="changePasswordBtn">Alterar minha senha</button><button class="btn secondary" id="backBtn">Simulador</button><button class="btn secondary" id="logoutPanelBtn">Sair</button></div></header>
<main class="wrap">
  <div class="title-row"><div><h1>Simulações gravadas</h1><p id="accessDescription">Carregando permissões...</p></div><button class="btn primary" id="exportBtn">Exportar Excel</button></div>
  <section class="filters">
    <div class="field"><label>Pesquisar</label><input id="searchInput" type="search" placeholder="Cliente, telefone, observação, veículo ou usuário"></div>
    <div class="field"><label>Data inicial</label><input id="dateFrom" type="date"></div>
    <div class="field"><label>Data final</label><input id="dateTo" type="date"></div>
    <div class="field"><label>Prazo</label><select id="termFilter"><option value="">Todos</option><option>36</option><option>42</option><option>48</option></select></div>
    <div class="field"><label>Resultado</label><select id="eligibleFilter"><option value="">Todos</option><option value="true">Elegíveis</option><option value="false">Não elegíveis</option></select></div>
  </section>
  <section class="summary"><div class="card"><span>Resultados</span><strong id="totalCount">0</strong></div><div class="card"><span>Elegíveis</span><strong id="eligibleCount">0</strong></div><div class="card"><span>Entrada total</span><strong id="entryTotal">R$ 0</strong></div><div class="card"><span>Ticket médio</span><strong id="averagePrice">R$ 0</strong></div></section>
  <div class="table-box"><table><thead><tr><th>Data</th><th>Usuário</th><th>Cliente</th><th>Telefone</th><th>Veículo</th><th>Preço</th><th>Entrada</th><th>%</th><th>Prazo</th><th>Parcela</th><th>Resultado</th><th>Observações</th><th>Ações</th></tr></thead><tbody id="resultsBody"><tr><td class="empty" colspan="13">Carregando...</td></tr></tbody></table></div>
  <section class="admin-users" id="usersSection"><h2>Administração de usuários</h2><form class="user-form" id="createUserForm"><div class="field"><label>Nome</label><input id="newUserName" required></div><div class="field"><label>E-mail</label><input id="newUserEmail" type="email" required></div><div class="field"><label>Perfil</label><select id="newUserRole"><option value="operator">Operador</option><option value="manager">Gestor</option></select></div><div class="field"><label>Senha temporária</label><input id="newUserPassword" type="password" minlength="8" required></div><button class="btn primary" type="submit">Criar usuário</button></form><div class="message" id="userMessage"></div><div class="user-list" id="userList"></div></section>
</main>
<dialog id="editDialog"><form id="editForm"><h2>Editar simulação</h2><input id="editId" type="hidden"><div class="dialog-grid"><div class="field"><label>Data</label><input id="editDate" type="date" required></div><div class="field"><label>Telefone</label><input id="editPhone" required></div><div class="field wide"><label>Cliente</label><input id="editName" required></div><div class="field wide"><label>Observações</label><textarea id="editNotes"></textarea></div></div><div class="dialog-actions"><button class="btn secondary" id="cancelEdit" type="button">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form></dialog>
<dialog id="passwordDialog"><form id="passwordForm"><h2>Alterar minha senha</h2><div class="dialog-grid"><div class="field wide"><label>Nova senha</label><input id="accountNewPassword" type="password" minlength="8" autocomplete="new-password" required></div><div class="field wide"><label>Confirmar nova senha</label><input id="accountConfirmPassword" type="password" minlength="8" autocomplete="new-password" required></div></div><div class="message" id="passwordMessage" aria-live="polite"></div><div class="dialog-actions"><button class="btn secondary" id="cancelPassword" type="button">Cancelar</button><button class="btn primary" type="submit">Salvar nova senha</button></div></form></dialog>
<dialog id="userPasswordDialog"><form id="userPasswordForm"><h2>Definir nova senha</h2><input id="passwordUserId" type="hidden"><p class="message" id="passwordUserEmail"></p><div class="dialog-grid"><div class="field wide"><label>Nova senha temporária</label><input id="managedNewPassword" type="password" minlength="8" autocomplete="new-password" required></div><div class="field wide"><label>Confirmar nova senha</label><input id="managedConfirmPassword" type="password" minlength="8" autocomplete="new-password" required></div></div><div class="message" id="managedPasswordMessage" aria-live="polite"></div><div class="dialog-actions"><button class="btn secondary" id="cancelManagedPassword" type="button">Cancelar</button><button class="btn primary" type="submit">Definir nova senha</button></div></form></dialog>
<script src="admin.js"></script>
</body>
</html>
